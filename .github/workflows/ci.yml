name: CI

on:
  push:
  pull_request:

jobs:
  qualidade-e-testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar Python 3.13 e dependências
        run: |
          uv python install 3.13
          uv sync --all-groups

      - name: Lint e formatação (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Só testes offline: sem chave da OpenAI e sem baixar o modelo de embeddings.
      - name: Testes
        run: uv run pytest
